<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Quiz </title>

    <style>
        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: gray;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            color: #bb0000;
        }

        .question {
            margin-bottom: 25px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 5px solid #006600;
            border-radius: 5px;
        }

        p {
            font-weight: bold;
        }

        label {
            display: block;
            margin: 8px 0;
        }

        button {
            background-color: #00bb1f;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #880000;
        }

        footer {
            text-align: center;
            background-color: #006600;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Math Quiz</h1>
        <p>Simple Math Questions for math professors😉😉</p>
    </header>

    <div class="container">

        <h2>Answer the Questions Below</h2>

        <div class="question">
            <p>1. 2x+5=17?</p>

            <label><input type="radio" name="q1"> 4</label>
            <label><input type="radio" name="q1"> 7</label>
            <label><input type="radio" name="q1"> 5</label>
            <label><input type="radio" name="q1"> 6</label>
        </div>

        <div class="question">
            <p>2. 3y−9=12?</p>

            <label><input type="radio" name="q2"> 5</label>
            <label><input type="radio" name="q2"> 6</label>
            <label><input type="radio" name="q2"> 7</label>
            <label><input type="radio" name="q2"> 8</label>
        </div>

        <div class="question">
            <p>3. 7+5?</p>

            <label><input type="radio" name="q3"> 5</label>
            <label><input type="radio" name="q3"> 13</label>
            <label><input type="radio" name="q3"> 12</label>
            <label><input type="radio" name="q3"> 10</label>
        </div>

        <div class="question">
            <p>4. 70+30?</p>

            <label><input type="radio" name="q4"> 100</label>
            <label><input type="radio" name="q4"> 200</label>
            <label><input type="radio" name="q4"> 5000</label>
            <label><input type="radio" name="q4"> 600</label>
        </div>

        <div class="question">
            <p>5. 2+5=?</p>

            <label><input type="radio" name="q5"> 56</label>
            <label><input type="radio" name="q5"> 7</label>
            <label><input type="radio" name="q5"> 18</label>
            <label><input type="radio" name="q5"> 36</label>
        </div>

        <button>Submit Answers</button>

    </div>

    <footer>
        <p>&copy; 2026 BrainFreeze Math</p>
    </footer>

</body>
</html>
